# The local database for Journey. scripts/dev.sh starts it for you; by hand: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey
      POSTGRES_DB: journey
    ports:
      - "5432:5432"
    volumes:
      - journey-db:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/10-journey-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journey"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  journey-db:
