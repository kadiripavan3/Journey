<figure class="arch" aria-labelledby="arch-cap">
  <div class="arch-zones">
    <div class="zone">
      <p class="zone-h"><b>On the phone</b><span>The Journey app · Expo, React Native</span></p>
      <ul>
        <li>Screens</li>
        <li>Sign-in<span class="n">1</span><small>Apple, Google or an email code</small></li>
        <li>Data cache<span class="n">1</span><small>TanStack Query</small></li>
        <li>Drafts and upload queue<span class="n">2</span><span class="n">3</span><small>SQLite, on the phone</small></li>
      </ul>
    </div>
    <span class="arch-link" aria-hidden="true"><svg class="ic"><use href="#i-right"/></svg></span>
    <div class="zone hl">
      <p class="zone-h"><b>Journey API</b><span>Spring Boot, Java · on Fly.io</span></p>
      <ul>
        <li>REST API<span class="n">1</span><span class="n">2</span><span class="n">3</span><small>every read and write goes through it</small></li>
        <li>Rules and privacy<span class="n">1</span><small>who may see and change what, with tests</small></li>
        <li>Notifications and safety<span class="n">4</span><small>push, photo checks</small></li>
        <li>Scheduled jobs<span class="n">5</span><small>auto-pause, trending, weekly digest</small></li>
        <li>Share pages<span class="n">6</span><small>web pages for shared links</small></li>
      </ul>
    </div>
    <span class="arch-link" aria-hidden="true"><svg class="ic"><use href="#i-right"/></svg></span>
    <div class="zone">
      <p class="zone-h"><b>Services it uses</b><span>Managed, pay as you grow</span></p>
      <ul>
        <li>Database<span class="n">1</span><span class="n">5</span><small>PostgreSQL on Supabase</small></li>
        <li>Sign-in<span class="n">1</span><small>Supabase Auth</small></li>
        <li>Photos<span class="n">2</span><small>Cloudflare R2 with its CDN</small></li>
        <li>Video<span class="n">3</span><small>Mux</small></li>
        <li>Push<span class="n">4</span><span class="n">5</span><small>Expo Push to Apple and Google</small></li>
        <li>Email<span class="n">5</span><small>Resend</small></li>
        <li>Photo moderation<span class="n">4</span></li>
      </ul>
    </div>
  </div>
  <ol class="arch-flows">
    <li><span><b>Sign in, read and write.</b> The app signs in with Supabase Auth and sends its sign-in token with every request. The Journey API checks who you are and what you may see, then reads or writes the database. The app never talks to the database itself.</span></li>
    <li><span><b>Photos.</b> The app asks the API for a one-time upload link and sends the photo straight to storage. The CDN serves it back quickly.</span></li>
    <li><span><b>Clips.</b> The same with Mux: a one-time upload link from the API, and Mux tells the API when the clip is ready to play.</span></li>
    <li><span><b>Notifications and safety.</b> When an entry is posted, the API sends the push notifications and has new photos checked.</span></li>
    <li><span><b>Scheduled jobs.</b> The API pauses journeys after 30 quiet days and updates the trending scores. Once a week it sends the digest: one push, plus an email for people who asked for it.</span></li>
    <li><span><b>Sharing.</b> The API also serves the public pages behind shared links, for people who don't have the app.</span></li>
  </ol>
  <figcaption id="arch-cap">How the pieces connect. A number on a part means it takes part in that numbered flow.</figcaption>
</figure>
