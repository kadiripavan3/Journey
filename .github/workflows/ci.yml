name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: journey
          POSTGRES_DB: journey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey -d journey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and check the formatting (also checks openapi.json is current)
        run: ./mvnw -B -ntp verify

  image:
    name: API image (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image the API is deployed as still builds
        run: docker build -t journey-api apps/api

  mobile:
    name: App (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Generated files are current (theme, icons and API client)
        run: |
          npm run theme
          npm run icons
          npm run api:generate
          git diff --exit-code -- src/theme/tokens.ts src/ui/icons3d.ts assets/icons3d src/api/generated ../api/src/main/resources/static/share/tokens.css
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
