# Tests run against a real PostgreSQL, in their own database.
spring.datasource.url=${JOURNEY_TEST_DB_URL:jdbc:postgresql://localhost:5432/journey_test}
logging.level.app.journey=INFO
journey.media.local.dir=${java.io.tmpdir}/journey-test-media
journey.seed.enabled=false
# The tests call the API far faster than a person; the ceilings have a test of their own.
journey.rate-limit.enabled=false
