# Tests run against a real PostgreSQL, in their own database.
spring.datasource.url=${JOURNEY_TEST_DB_URL:jdbc:postgresql://localhost:5432/journey_test}
logging.level.app.journey=INFO
journey.media.local.dir=${java.io.tmpdir}/journey-test-media
journey.seed.enabled=false
# The tests call the API far faster than a person; the ceilings have a test of their own.
journey.rate-limit.enabled=false
# The tests send the pushes themselves, when they want to look at them.
journey.push.deliver-every=PT24H
journey.push.entries-wait=PT0S
journey.push.likes-wait=PT0S
# Several test contexts are kept open at once, each with its own pool: keep them small, and let go of
# connections nobody is using.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
