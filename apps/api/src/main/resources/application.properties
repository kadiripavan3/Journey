spring.application.name=journey-api
server.port=8080

# Database. The defaults match the local database (see the repo's README).
spring.datasource.url=${JOURNEY_DB_URL:jdbc:postgresql://localhost:5432/journey}
spring.datasource.username=${JOURNEY_DB_USER:journey}
spring.datasource.password=${JOURNEY_DB_PASSWORD:journey}

# The schema is owned by Flyway (db/migration). The code reads and writes it with plain SQL (the *Store classes).
spring.flyway.locations=classpath:db/migration
# On Supabase the API keeps its tables in a schema of its own (JOURNEY_DB_SCHEMA=journey), so Supabase's own
# data API, which serves the "public" schema to anyone with the project's public key, never sees them.
# See docs/08-connect-services.md.
spring.flyway.default-schema=${JOURNEY_DB_SCHEMA:public}
spring.flyway.schemas=${JOURNEY_DB_SCHEMA:public}
spring.datasource.hikari.maximum-pool-size=${JOURNEY_DB_POOL:10}
# Every connection looks in the API's own schema first, wherever it was named (so the database address doesn't
# have to repeat it), then where Supabase keeps extensions, then the default.
spring.datasource.hikari.connection-init-sql=set search_path to "${JOURNEY_DB_SCHEMA:public}", extensions, public

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health

# The API's description and its try-it-out page are for the people building it: on in local mode, off everywhere else.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind a proxy (Fly.io), set JOURNEY_FORWARD_HEADERS=framework so the API knows it is reached over https,
# and JOURNEY_PUBLIC_URL to the address people use, for links that leave the app (a shared journey's page).
server.forward-headers-strategy=${JOURNEY_FORWARD_HEADERS:none}
journey.public-url=${JOURNEY_PUBLIC_URL:}
# The header in which the proxy says where a request really came from (on Fly.io: Fly-Client-IP). Wrong
# passwords and requests without a sign-in are counted by it. Empty: the address of the connection itself.
journey.client-address-header=${JOURNEY_CLIENT_ADDRESS_HEADER:}

# Every log line of a request carries the request's id (see RequestId), and so does an error the app shows.
logging.pattern.correlation=[%X{request:-}] 

# When the API is asked to stop (a deploy), it finishes what it is doing first: requests, and jobs under way.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=40s

# The API's own style sheets and pictures (for the shared pages) may be kept by browsers for a day.
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true

# The automatic photo check: 'rekognition' (AWS Rekognition, which needs AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY in the environment), 'off' (nothing is checked until it is switched on), or 'local'
# (a stand-in for building and testing). See MediaScreening.
journey.moderation.mode=${JOURNEY_MODERATION_MODE:rekognition}
journey.moderation.rekognition.region=${JOURNEY_MODERATION_REGION:eu-west-1}
# How sure Rekognition must be (0 to 100) before a photo is held for a person to look at.
journey.moderation.rekognition.min-confidence=80

# The reviewer's pages under /admin exist only when this password is set. A reviewer signs in with any name and this password.
journey.admin.password=${JOURNEY_ADMIN_PASSWORD:}

# The address shown on the contact page, and what the two files that let shared links open the app are built from.
journey.contact.email=${JOURNEY_CONTACT_EMAIL:}
journey.links.ios-app-id=${JOURNEY_IOS_APP_ID:}
journey.links.android-package=${JOURNEY_ANDROID_PACKAGE:}
journey.links.android-fingerprints=${JOURNEY_ANDROID_FINGERPRINTS:}

# How fast one person may call the API, per minute. See RateLimit.
journey.rate-limit.enabled=true
journey.rate-limit.reads-per-minute=600
journey.rate-limit.writes-per-minute=120
journey.rate-limit.sign-ins-per-minute=10

# How people sign in: 'local' (test code) or 'supabase' (connected later). See AuthProperties.
journey.auth.mode=${JOURNEY_AUTH_MODE:supabase}

journey.auth.supabase.url=${SUPABASE_URL:}
# Only for an older Supabase project that signs tokens with a shared secret. Empty means: use its public keys.
journey.auth.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# The project's secret key. Used only to remove the sign-in when an account is deleted.
journey.auth.supabase.service-key=${SUPABASE_SERVICE_KEY:}

# Where photos and clips are kept: 'local' (a folder on this computer) or 'r2' (Cloudflare R2).
journey.media.mode=${JOURNEY_MEDIA_MODE:r2}
journey.media.r2.endpoint=${R2_ENDPOINT:}
journey.media.r2.bucket=${R2_BUCKET:}
journey.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
journey.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
# The address photos are read from: the bucket's public (CDN) address, without a slash at the end.
journey.media.r2.public-url=${R2_PUBLIC_URL:}

# Push notifications: 'expo' sends through the Expo Push Service; 'off' sends nothing; 'local' writes each push
# to the log.
# The access token is only needed if "enhanced security" is switched on for the Expo project.
journey.push.mode=${JOURNEY_PUSH_MODE:expo}
journey.push.expo.access-token=${EXPO_ACCESS_TOKEN:}
journey.push.expo.url=https://exp.host/--/api/v2/push
# How long new entries and likes wait before they are pushed, so a burst arrives as one message.
journey.push.entries-wait=PT10M
journey.push.likes-wait=PT1H
journey.push.deliver-every=PT30S

# Email (the weekly digest for people who asked for it): 'resend' sends it; 'off' sends nothing; 'local' writes
# it to the log.
journey.email.mode=${JOURNEY_EMAIL_MODE:resend}
journey.email.resend.api-key=${RESEND_API_KEY:}
journey.email.resend.url=https://api.resend.com
journey.email.from=${JOURNEY_EMAIL_FROM:Journey <hello@example.com>}

# When the background jobs run (UTC). Reminders and the weekly digest are checked every hour and arrive at each
# person's own hour (the digest: their own Sunday evening).
journey.reminders.cron=0 0 * * * *
journey.digest.cron=0 0 * * * *
journey.autopause.cron=0 15 4 * * *
journey.trending.cron=0 10 * * * *
# What is asked of the push service a while later (what became of each push), and the nightly tidying.
journey.push.outcomes-cron=0 7/15 * * * *
journey.push.cleanup-cron=0 50 3 * * *
journey.email.deliver-every=PT1M
journey.email.cleanup-cron=0 55 3 * * *
# Emails go out a couple a second: email services take only so many.
journey.email.pause=PT0.5S
journey.media.sweep-every=PT1M
journey.media.catch-up-cron=0 4/15 * * * *
journey.moderation.forget-cron=0 20 4 * * *
journey.rate-limit.cleanup-cron=0 45 3 * * *
journey.accounts.upkeep-every=PT5M
# Set to false to run the API without any of the jobs above (the tests do).
journey.jobs.enabled=true
spring.servlet.multipart.enabled=false

# Places: 'device' (the phone's own place search; nothing for the API to do) or 'local' (a bundled list, for the web preview).
journey.places.mode=${JOURNEY_PLACES_MODE:device}

# Video clips: 'mux' (the real service), 'off' (the app offers photos only), or 'local' (kept as they arrive, on
# this computer). See VideoService.
journey.video.mode=${JOURNEY_VIDEO_MODE:mux}
journey.video.mux.token-id=${MUX_TOKEN_ID:}
journey.video.mux.token-secret=${MUX_TOKEN_SECRET:}
journey.video.mux.webhook-secret=${MUX_WEBHOOK_SECRET:}
journey.video.mux.api-url=${MUX_API_URL:https://api.mux.com}
journey.video.mux.image-url=https://image.mux.com
