# Local mode: everything runs on one computer, with stand-ins for the outside services.
# Start it with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

journey.auth.mode=local
journey.auth.local.secret=local-development-only-not-a-real-secret-0123456789
journey.auth.local.code=123456
journey.auth.local.token-ttl=30d

# The stand-in tables (db/local) exist only in local mode.
spring.flyway.locations=classpath:db/migration,classpath:db/local

# The web preview runs in a browser, which needs CORS. Phones don't.
journey.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*

logging.level.app.journey=DEBUG

# The API's description (/v3/api-docs) and try-it-out page (/swagger-ui.html).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# One computer, one address: a tester signing in and out shouldn't hit the ceiling for sign-ins.
journey.rate-limit.sign-ins-per-minute=120

# Photos and clips are kept in a folder and served by the API itself.
journey.media.mode=local
journey.media.local.dir=${JOURNEY_MEDIA_DIR:.dev/media}
journey.media.local.secret=${journey.auth.local.secret}

# Sample creators and journeys, added once when the database is empty.
journey.seed.enabled=true

# Pushes and emails are written to this log instead of being sent. Pushes go out quickly, so you see them while testing.
journey.push.mode=local
journey.email.mode=local
journey.push.entries-wait=PT20S
journey.push.likes-wait=PT20S
journey.push.deliver-every=PT10S

# Places and clips (stream A). The web preview has no place search of its own, so the API answers from a bundled
# list; phones use their own. Clips are kept as they arrive and are ready at once; the real video service is Mux.
journey.places.mode=local
journey.video.mode=local
